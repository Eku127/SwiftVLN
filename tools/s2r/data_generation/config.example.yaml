# SwiftVLN S2R SatDronePair generation example.
#
# Copy this file to a writable location, replace every /path/to value, then run:
#   python -m tools.s2r.data_generation --config /path/to/data_generation.yaml <dataset> <command>
#
# Paths may be absolute, use ~/${ENV_VAR}, or be relative to this YAML file.
# Explicit command-line arguments always override values from this file.
# All sample_preview sections route to one schema-aware renderer; keep them under
# each dataset so dataset-specific defaults and filters remain explicit.
# SUES/UAV-VisLoc center_recrop_pairs also share one schema-detecting command.

DATASETS:
  denseuav:
    build_pairs:
      input:
        dataset_root: /path/to/DenseUAV/DenseUAV
      output:
        output_dir: /path/to/SatDronePair/denseuav
      args:
        workers: 16
    sample_preview:
      input:
        dataset_dir: /path/to/SatDronePair/denseuav
      output:
        output: /path/to/SatDronePair/denseuav/samples_preview.jpg
      args:
        rows: 4
        seed: 42

  gta_uav:
    build_pairs:
      input:
        data_root: /path/to/GTA-UAV-LR
      output:
        output_dir: /path/to/SatDronePair/gta
      args:
        workers: 8
    sample_preview:
      input:
        dataset_dir: /path/to/SatDronePair/gta
      output:
        output: /path/to/SatDronePair/gta/samples_preview.jpg
      args:
        rows: 4
        seed: 42

  sues:
    pipeline:
      input:
        data_root: /path/to/SUES-200-512x512
      output:
        output_dir: /path/to/SatDronePair-work/sues_export
      args:
        heights: "150,200,250,300"
        nadir_min_conf: 0.30
        crop_sizes: "384,256"
    merge_variants:
      input:
        dataset_dir: /path/to/SatDronePair-work/sues_export
      output:
        output_dir: /path/to/SatDronePair/sues
      args:
        variant_map: orig:satellite:drone,crop384:satellite_crop384:drone_crop384,crop256:satellite_crop256:drone_crop256
        mode: link
    sample_preview:
      input:
        dataset_dir: /path/to/SatDronePair/sues
      output:
        output: /path/to/SatDronePair/sues/samples_preview.jpg

  uavvisloc:
    export_selected:
      input:
        data_root: /path/to/UAV-VisLoc/data
        sat_bounds_csv: /path/to/UAV-VisLoc/satellite_coordinates_range.csv
      output:
        output_dir: /path/to/SatDronePair-work/uavvisloc_orig
      args:
        allow_missing_pose: true
    center_recrop_pairs:
      input:
        dataset_dir: /path/to/SatDronePair-work/uavvisloc_orig
      output:
        output_dir: /path/to/SatDronePair-work/uavvisloc_crop384
      args:
        crop_size: 384
        output_size: 512
    merge_variants:
      output:
        output_dir: /path/to/SatDronePair/uavvisloc
      args:
        variant:
          - orig=/path/to/SatDronePair-work/uavvisloc_orig
          - crop384=/path/to/SatDronePair-work/uavvisloc_crop384
        mode: link
    sample_preview:
      input:
        dataset_dir: /path/to/SatDronePair/uavvisloc
      output:
        output: /path/to/SatDronePair/uavvisloc/samples_preview.jpg
      args:
        rows: 6
        seed: 42
