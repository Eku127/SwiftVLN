[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swiftvln-inference"
version = "0.1.0"
description = "SwiftVLN inference and evaluation runtime"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
swiftvln-eval = "swiftvln.model.eval:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "swiftvln.s2r.data_generation",
    "swiftvln.s2r.data_generation.*",
]

[tool.setuptools.package-data]
swiftvln = ["configs/*.yaml"]
