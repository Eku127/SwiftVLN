[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swiftvln"
version = "0.1.0"
description = "SwiftVLN independent repository"
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
s2r-data = [
    "numpy",
    "Pillow",
    "PyYAML",
    "scipy",
]

[project.scripts]
swiftvln = "swiftvln.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"swiftvln" = ["configs/*/*.yaml"]
