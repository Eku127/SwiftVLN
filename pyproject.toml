[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swiftvln"
version = "0.1.0"
description = "SwiftVLN independent repository"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
swiftvln = "swiftvln.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
