# SatNav VLN Task Configuration for NaVILA Baseline Evaluation
#
# Keep in sync with other baseline SatNav configs.

ENVIRONMENT:
  MAX_EPISODE_STEPS: 500

SIMULATOR:
  TYPE: satsim
  FORWARD_STEP_SIZE: 10
  TURN_ANGLE: 15
  RGB_SENSOR:
    WIDTH: 448
    HEIGHT: 448
    HFOV: 90
  AERIAL:
    API_KEY: "AIzaSyAvdA9uijk4A2IX0sYeMOc2Kv3dH7GpDRc"
    BROWSER: chrome
    HEADLESS: true

TASK:
  TYPE: VLN
  SUCCESS_DISTANCE:
    DEFAULT: 10.0
    Boundary: 10.0
    LandmarkSet: 30.0
    Road: 10.0
  POSSIBLE_ACTIONS: [STOP, MOVE_FORWARD, TURN_LEFT, TURN_RIGHT]
  MEASUREMENTS: [DISTANCE_TO_GOAL, SUCCESS, ORACLE_SUCCESS, SPL, PATH_LENGTH, TOP_DOWN_MAP]
  TOP_DOWN_MAP:
    MAP_RESOLUTION: 1024
    PADDING_METERS: 50.0
    DRAW_REFERENCE_PATH: True
    DRAW_SOURCE_AND_TARGET: True

DATASET:
  TYPE: SatNav
  SPLIT: val_seen
  DATA_PATH: /mnt/data3/jiangjiajun/dataset/satnav_datasets/ver_260418/episodes/eval/val_seen/all_episodes.json
  SCENES_DIR: /mnt/data3/jiangjiajun/dataset/satnav_datasets/scenes
