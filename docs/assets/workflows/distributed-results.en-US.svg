nd after every completed episode</text></g></g></g><g data-cell-id="19"><g><rect x="32" y="519" width="976" height="35" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#20364C" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(32, 54, 76);"><text x="520" y="544.5">Each rank also writes .dist_sync/rank_&lt;n&gt;.done.json when its work finishes.</text></g></g></g><g data-cell-id="20"><g><path d="M 985 510 L 985 562.76" fill="none" stroke="#be7534" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(190, 117, 52);"/><path d="M 985 570.76 L 981 562.76 L 989 562.76 Z" fill="#be7534" stroke="#be7534" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(190, 117, 52); stroke: rgb(190, 117, 52);"/></g></g><g data-cell-id="21"><g transform="translate(0.5,0.5)"><rect x="32" y="573" width="976" height="74" rx="8.88" ry="8.88" fill="#f1edf8" stroke="#7963ac" stroke-width="1.4" pointer-events="all" style="fill: rgb(241, 237, 248); stroke: rgb(121, 99, 172);"/></g><g><g fill="#20364C" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="21px" style="fill: rgb(32, 54, 76);"><text x="520" y="619.5">Rank 0: wait for all markers → deduplicate log → results + metric summary</text></g></g></g></g></g></g></svg>