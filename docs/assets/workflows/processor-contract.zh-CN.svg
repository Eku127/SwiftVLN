<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1041px" height="641px" viewBox="0 0 1041 641"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="2"><g><rect x="0" y="0" width="1040" height="640" fill="#ffffff" stroke="none" pointer-events="all" style="fill: rgb(255, 255, 255);"/></g></g><g data-cell-id="3"><g><rect x="32" y="22" width="970" height="38" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#20364C" font-family="Arial" font-weight="bold" text-anchor="start" font-size="28px" style="fill: rgb(32, 54, 76);"><text x="40" y="54">History Processor：对齐训练与推理</text></g></g></g><g data-cell-id="4"><g><rect x="32" y="67" width="970" height="34" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#627487" font-family="Arial" text-anchor="start" font-size="17px" style="fill: rgb(98, 116, 135);"><text x="40" y="91.5">一致的帧顺序与处理器参数，得到相同形状的 N × D 输出。</text></g></g></g><g data-cell-id="5"><g transform="translate(0.5,0.5)"><rect x="32" y="127" width="976" height="95" rx="11.4" ry="11.4" fill="#f1edf8" stroke="#7963ac" stroke-width="1.4" pointer-events="all" style="fill: rgb(241, 237, 248); stroke: rgb(121, 99, 172);"/></g></g><g data-cell-id="6"><g><rect x="42" y="137" width="956" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#7963AC" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="21px" style="fill: rgb(121, 99, 172);"><text x="520" y="162.5">create_history_processor(...)</text></g></g></g><g data-cell-id="7"><g><rect x="42" y="173" width="956" height="43" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#20364C" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(32, 54, 76);"><text x="520" y="202.5">同一实现 · 对齐采样方式与压缩参数</text></g></g></g><g data-cell-id="8"><g transform="translate(0.5,0.5)"><rect x="32" y="285" width="458" height="137" rx="16.44" ry="16.44" fill="#ebf4fa" stroke="#287bad" stroke-width="1.4" pointer-events="all" style="fill: rgb(235, 244, 250); stroke: rgb(40, 123, 173);"/></g></g><g data-cell-id="9"><g><rect x="42" y="295" width="438" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#287BAD" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="21px" style="fill: rgb(40, 123, 173);"><text x="261" y="320.5">训练 · SwiftVLNTemplate</text></g></g></g><g data-cell-id="10"><g><rect x="42" y="331" width="438" height="85" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#20364C" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(32, 54, 76);"><text x="261" y="359.5">get_output_token_count(...) → N 个占位</text><text x="261" y="381.5">process(...) → N × D embedding</text><text x="261" y="403.5">注入 &lt;history_memory&gt;</text></g></g></g><g data-cell-id="11"><g transform="translate(0.5,0.5)"><rect x="550" y="285" width="458" height="137" rx="16.44" ry="16.44" fill="#eaf6f2" stroke="#268979" stroke-width="1.4" pointer-events="all" style="fill: rgb(234, 246, 242); stroke: rgb(38, 137, 121);"/></g></g><g data-cell-id="12"><g><rect x="560" y="295" width="438" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#268979" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="21px" style="fill: rgb(38, 137, 121);"><text x="779" y="320.5">评测 · InferenceSession</text></g></g></g><g data-cell-id="13"><g><rect x="560" y="331" width="438" height="85" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#20364C" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: rgb(32, 54, 76);"><text x="779" y="359.5">process(...) → N × D embedding</text><text x="779" y="381.5">写入 history_cache</text><text x="779" y="403.5">拼接提示词 inputs_embeds</text></g></g></g><g data-cell-id="14"><g><path d="M 261 222 L 261 274.76" fill="none" stroke="#7963ac" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(121, 99, 172);"/><path d="M 261 282.76 L 257 274.76 L 265 274.76 Z" fill="#7963ac" stroke="#7963ac" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(121, 99, 172); stroke: rgb(121, 99, 172);"/></g></g><g data-cell-id="15"><g><path d="M 779 222 L 779 274.76" fill="none" stroke="#7963ac" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(121, 99, 172);"/><path d="M 779 282.76 L 775 274.76 L 783 274.76 Z" fill="#7963ac" stroke="#7963ac" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(121, 99, 172); stroke: rgb(121, 99, 172);"/></g></g><g data-cell-id="16"><g transform="translate(0.5,0.5)"><rect x="32" y="500" width="976" height="98" rx="11.76" ry="11.76" fill="#fcf2e6" stroke="#be7534" stroke-width="1.4" pointer-events="all" style="fill: rgb(252, 242, 230); stroke: rgb(190, 117, 52);"/></g><g><g fill="#20364C" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="21px" style="fill: rgb(32, 54, 76);"><text x="520" y="546">共同约束</text><text x="520" y="571">N = 实际输出 token 数 · D = 模型隐藏维度 · 保留每个样本的边界</text></g></g></g><g data-cell-id="17"><g><path d="M 261 422 L 261 489.76" fill="none" stroke="#287bad" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(40, 123, 173);"/><path d="M 261 497.76 L 257 489.76 L 265 489.76 Z" fill="#287bad" stroke="#287bad" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(40, 123, 173); stroke: rgb(40, 123, 173);"/></g></g><g data-cell-id="18"><g><path d="M 779 422 L 779 489.76" fill="none" stroke="#268979" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(38, 137, 121);"/><path d="M 779 497.76 L 775 489.76 L 783 489.76 Z" fill="#268979" stroke="#268979" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(38, 137, 121); stroke: rgb(38, 137, 121);"/></g></g></g></g></g></svg>